name: release
# On a tag vX.Y.Z: refuse a tag that differs from the Cargo.toml version
# or has no CHANGELOG.md section, build static musl archives with dist
# on each architecture, attest every archive, and open a DRAFT release
# with the archives, their checksums and the tag's changelog notes.
# Publishing the draft stays manual.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DIST_VERSION: 0.30.3

jobs:
  guard:
    name: tag, version and notes
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: tag equals the Cargo.toml version
        run: |
          crate=$(awk '/^\[package\]/{p=1; next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/^[^"]*"|".*$/, ""); print; exit}' Cargo.toml)
          if [ -z "${crate}" ]; then echo "no [package] version in Cargo.toml"; exit 1; fi
          if [ "${GITHUB_REF_NAME}" != "v${crate}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not equal v${crate} from Cargo.toml"; exit 1
          fi
      # The notes are the tag's section of CHANGELOG.md, "## X.Y.Z" or
      # "## [X.Y.Z] - date"; a tag without one is not released.
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (on) exit; h = $0; sub(/^## \[?/, "", h); sub(/[] ].*$/, "", h); on = (h == v); next } on' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then echo "CHANGELOG.md has no section for ${v}"; exit 1; fi
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: release-notes.md
      - name: install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: dist plan accepts the tag
        run: dist plan --tag="${GITHUB_REF_NAME}" --output-format=json > /dev/null
      - name: generate completion and manpage assets
        run: |
          cargo run --quiet --locked --bin eb-pipeline -- completions --shell bash --out-dir cli-assets/completions
          cargo run --quiet --locked --bin eb-pipeline -- completions --shell zsh --out-dir cli-assets/completions
          cargo run --quiet --locked --bin eb-pipeline -- completions --shell fish --out-dir cli-assets/completions
          cargo run --quiet --locked --bin eb-pipeline -- man --out-dir cli-assets/man
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-assets
          path: cli-assets/

  build-local:
    name: build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: build archive
        shell: bash
        run: |
          dist build --tag="${GITHUB_REF_NAME}" --artifacts=local --target="${{ matrix.target }}" --print=linkage --output-format=json > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_ENV"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - name: archive has every declared workspace binary
        shell: bash
        run: |
          python3 .github/scripts/check-release-archive.py \
            --declared .github/release-binaries.txt \
            --archive "target/distrib/eb-pipeline-${{ matrix.target }}.tar.xz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: ${{ env.paths }}

  build-global:
    name: unified checksums
    needs: build-local
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - name: build global artifacts
        shell: bash
        run: |
          dist build --tag="${GITHUB_REF_NAME}" --artifacts=global --output-format=json > dist-manifest.json
          echo "paths<<EOF" >> "$GITHUB_ENV"
          jq --raw-output '.upload_files[]' dist-manifest.json >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-global
          path: ${{ env.paths }}

  publish:
    name: attest and draft release
    needs: [guard, build-local, build-global]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cli-assets
          path: cli-assets
      # A release asset is a file: the completions and the man page go in one
      # archive.
      - name: archive the completions and the man page
        run: |
          tar -C cli-assets --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
            -czf artifacts/eb-pipeline-cli-assets.tar.gz completions man
          tar -tzf artifacts/eb-pipeline-cli-assets.tar.gz
      # dist's global step hashes only the files it builds itself (source.tar.gz),
      # so sha256.sum is written here over every asset, after each per-file
      # .sha256 has been checked.
      - name: check assets and write sha256.sum
        working-directory: artifacts
        run: |
          ls -l
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -f "eb-pipeline-${t}.tar.xz" || { echo "missing archive for ${t}"; exit 1; }
          done
          for f in *.sha256; do sha256sum --check "$f"; done
          rm -f sha256.sum
          sha256sum --binary eb-pipeline-*.tar.xz eb-pipeline-cli-assets.tar.gz source.tar.gz > sha256.sum
          cat sha256.sum
          test "$(wc -l < sha256.sum)" -eq 4
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.xz
            artifacts/eb-pipeline-cli-assets.tar.gz
            artifacts/source.tar.gz
      # A draft: release assets cannot change once a release is published,
      # so every asset is attached before a person publishes it.
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${GITHUB_REF_NAME}" --notes-file notes/release-notes.md --draft
