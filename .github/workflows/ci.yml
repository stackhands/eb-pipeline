name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt, clippy, tests, example lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Install promtool 3.16.0
        run: |
          set -euo pipefail
          base=https://github.com/prometheus/prometheus/releases/download/v3.16.0
          archive=prometheus-3.16.0.linux-amd64.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSLO "$base/$archive"
          curl --proto '=https' --tlsv1.2 -fsSLO "$base/sha256sums.txt"
          grep " $archive\$" sha256sums.txt | sha256sum --check
          tar -xzf "$archive" --strip-components=1 "prometheus-3.16.0.linux-amd64/promtool"
      - name: Validate generated Prometheus metrics
        run: |
          cat > result.json <<'EOF'
          {
            "kind": "result",
            "site": "example",
            "target": "cpu",
            "build_type": "production",
            "run_id": "ci",
            "sharded": false,
            "exit_code": 0,
            "ended_at": "2026-11-17T20:00:00Z",
            "duration_seconds": 12.5,
            "counts": {"success": 2, "failed": 0},
            "phases": [{"name": "build", "status": "ok"}]
          }
          EOF
          cargo run --locked --quiet --bin eb-pipeline -- metrics --result result.json > metrics.prom
          ./promtool check metrics < metrics.prom
          cargo run --locked --quiet --bin eb-cvmfs -- \
            --dry-run --metrics-file cvmfs.prom repo.example -- true > /dev/null
          ./promtool check metrics < cvmfs.prom
      - name: Examples hold placeholders only
        run: cargo test --locked --test examples

  msrv:
    name: Rust 1.90 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Locked all-targets build
        run: cargo build --locked --all-targets

  docs:
    # The scripts behind the documented output; docs.yml builds the site.
    name: documentation examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked
      - name: Run the documentation examples
        run: |
          bash docs/examples/tutorial.sh
          bash docs/examples/cli.sh
          bash docs/examples/files.sh
          bash docs/examples/templates.sh
          bash docs/examples/site-file.sh
          bash docs/examples/ci.sh
          bash docs/examples/node-local.sh
          bash docs/examples/site-installs.sh
          bash docs/examples/rotation.sh
          bash docs/examples/staged.sh
          bash docs/examples/select.sh
          bash docs/examples/from-eb-stack.sh
          bash docs/examples/resume.sh
          bash docs/examples/summary.sh
          bash docs/examples/watch.sh
          bash docs/examples/junit.sh
