# The documentation toolchain, pinned by pixi.lock. `pixi run -e docs docbld`
# builds docs/build/html the way CI does; docs/orgmode/contributing.org has
# the steps. In a repository that already has a pixi.toml, copy the
# [feature.docs.*] tables and the docs environment into it.
[workspace]
name = "eb-pipeline"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[feature.docs.dependencies]
python = "3.13.*"
emacs = "30.*"
curl = "*"
lychee = "*"
rust = "1.90.*"
sphinx = "9.*"
myst-parser = "*"
shibuya = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx-sitemap = "*"
sphinx-autoapi = "*"

[feature.docs.tasks]
# Org pages to reStructuredText, docs/orgmode -> docs/source.
mkrst = { cmd = "emacs -Q --batch --load export.el", cwd = "docs" }
# export.el on a page of its own: each code and verbatim text comes out as a
# literal of the same text.
exporttest = { cmd = "python docs/tools/test_export.py" }
sitetest = { cmd = "python docs/tools/test_check_site.py" }
sphinxbld = { cmd = "sphinx-build -W -n --keep-going -d docs/build/doctrees -b html docs/source docs/build/html", depends-on = ["mkrst"] }
# The rustdoc site of the eb_pipeline library, served beside the Sphinx pages
# at api/. Any rustdoc warning, such as a broken intra-doc link, fails it, and
# so does a public item without a doc comment.
rustdoc = { cmd = "cargo doc --locked --no-deps --lib --target-dir docs/build/cargo && rm -rf docs/build/html/api && cp -r docs/build/cargo/doc docs/build/html/api && cp docs/tools/api-index.html docs/build/html/api/index.html", env = { RUSTDOCFLAGS = "-D warnings -D missing_docs" }, depends-on = ["sphinxbld"] }
# Every internal link and anchor resolves, and no page names a site. The
# changelog may name what a release removed; its links are still checked.
doccheck = { cmd = "python docs/tools/check_site.py docs/build/html --sources docs/orgmode --exempt changelog.html", depends-on = ["rustdoc"] }
docbld = { depends-on = ["exporttest", "sitetest", "doccheck"] }
# External links; needs the network, so CI runs it as its own step.
linkcheck = { cmd = "lychee --config lychee.toml --no-progress 'docs/build/html/**/*.html'" }
# Generated files are the ignored ones under docs/source (see .gitignore).
docdel = { cmd = "rm -rf docs/build && git clean -fdX docs/source" }

[environments]
docs = { features = ["docs"], no-default-feature = true }
