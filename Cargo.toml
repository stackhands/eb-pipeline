[package]
name = "eb-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Site-neutral EasyBuild pipeline driver configured by a per-site TOML file"
license = "MIT"
authors = ["the stackhands authors"]
repository = "https://github.com/stackhands/eb-pipeline"
readme = "README.md"
keywords = ["easybuild", "hpc", "slurm", "pipeline", "ci"]
categories = ["command-line-utilities", "development-tools", "science"]
exclude = [".github/"]

[[bin]]
name = "eb-pipeline"
path = "src/main.rs"

[lib]
name = "eb_pipeline"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
