[package]
name = "eb-pipeline"
version = "0.5.0"
edition = "2021"
rust-version = "1.90"
description = "Site-neutral EasyBuild pipeline driver configured by a per-site TOML file"
license = "MIT"
authors = ["the stackhands authors"]
repository = "https://github.com/stackhands/eb-pipeline"
documentation = "https://stackhands.github.io/eb-pipeline/"
readme = "README.md"
keywords = ["easybuild", "hpc", "slurm", "pipeline", "ci"]
categories = ["command-line-utilities", "development-tools", "science"]
exclude = [".github/"]

[[bin]]
name = "eb-pipeline"
path = "src/main.rs"

[[bin]]
name = "eb-test-map"
path = "src/bin/eb-test-map.rs"

[lib]
name = "eb_pipeline"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
libc = "0.2"
rfc9162 = "0.11.0"
ryu = "1.0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10.9"
shell-words = "1.1.1"
toml = "1.2"
unsafe-libyaml = "0.2.11"

[dev-dependencies]
tempfile = "3"

# cargo-dist builds with --profile=dist
[profile.dist]
inherits = "release"
lto = "thin"
